<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#132626"/>
      <stop offset="60%" stop-color="#0A1416"/>
      <stop offset="100%" stop-color="#04090A"/>
    </radialGradient>
    
    <!-- Primary Emerald-Teal Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2E2E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D1B1C" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.12" stroke="#34D399" stroke-width="1.5">
    <line x1="80" y1="16" x2="80" y2="496"/>
    <line x1="160" y1="16" x2="160" y2="496"/>
    <line x1="240" y1="16" x2="240" y2="496"/>
    <line x1="320" y1="16" x2="320" y2="496"/>
    <line x1="400" y1="16" x2="400" y2="496"/>
    <line x1="16" y1="80" x2="496" y2="80"/>
    <line x1="16" y1="160" x2="496" y2="160"/>
    <line x1="16" y1="240" x2="496" y2="240"/>
    <line x1="16" y1="320" x2="496" y2="320"/>
    <line x1="16" y1="400" x2="496" y2="400"/>
  </g>

  <!-- Outer Target Radar Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Crosshair Reticle Lines -->
  <g stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="70" x2="256" y2="115"/>
    <line x1="256" y1="397" x2="256" y2="442"/>
    <line x1="70" y1="256" x2="115" y2="256"/>
    <line x1="397" y1="256" x2="442" y2="256"/>
  </g>

  <!-- Central Spec Document Card -->
  <g filter="url(#emeraldGlow)">
    <rect x="156" y="136" width="200" height="240" rx="20" fill="url(#cardSurface)" stroke="url(#emeraldGrad)" stroke-width="3"/>
    
    <!-- Top Notch / Clip -->
    <path d="M 216 136 L 216 156 A 6 6 0 0 0 222 162 L 290 162 A 6 6 0 0 0 296 156 L 296 136 Z" fill="#10B981" opacity="0.7"/>

    <!-- Document Lines (PRD specs) -->
    <rect x="188" y="186" width="80" height="10" rx="5" fill="#34D399" opacity="0.9"/>
    
    <!-- Feature Checkrows with bullet nodes -->
    <circle cx="196" cy="225" r="7" fill="url(#cyanGrad)"/>
    <rect x="214" y="220" width="102" height="10" rx="5" fill="#E2E8F0" opacity="0.85"/>

    <circle cx="196" cy="260" r="7" fill="url(#cyanGrad)"/>
    <rect x="214" y="255" width="118" height="10" rx="5" fill="#E2E8F0" opacity="0.85"/>

    <circle cx="196" cy="295" r="7" fill="url(#cyanGrad)"/>
    <rect x="214" y="290" width="86" height="10" rx="5" fill="#E2E8F0" opacity="0.85"/>

    <circle cx="196" cy="330" r="7" fill="url(#cyanGrad)"/>
    <rect x="214" y="325" width="110" height="10" rx="5" fill="#E2E8F0" opacity="0.85"/>
  </g>

  <!-- Precision Star / Bullseye Badge Floating at Bottom Right -->
  <g transform="translate(325, 335)" filter="url(#intenseGlow)">
    <circle cx="30" cy="30" r="32" fill="#064E3B" stroke="url(#emeraldGrad)" stroke-width="3"/>
    <path d="M 30 14 L 34.5 24.5 L 46 25.5 L 37.5 33 L 40 44 L 30 38 L 20 44 L 22.5 33 L 14 25.5 L 25.5 24.5 Z" fill="url(#cyanGrad)"/>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 46 96 L 46 46 L 96 46" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6"/>
  <path d="M 466 96 L 466 46 L 416 46" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6"/>
  <path d="M 46 416 L 46 466 L 96 466" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6"/>
  <path d="M 466 416 L 466 466 L 416 466" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6"/>
</svg>
