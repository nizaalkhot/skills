<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dslBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2B0E1E"/>
      <stop offset="60%" stop-color="#14060E"/>
      <stop offset="100%" stop-color="#080205"/>
    </radialGradient>

    <!-- Rose-Pink Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Magenta to Amber Gradient -->
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Token Glow -->
    <filter id="dslGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#dslBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#roseGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Aesthetic Golden Ratio Arc / Guide Circles -->
  <g opacity="0.18" stroke="#FB7185" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="111"/>
    <circle cx="256" cy="256" r="68"/>
    <path d="M 145 367 C 145 256, 256 145, 367 145"/>
    <line x1="256" y1="40" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
  </g>

  <!-- Layered Design System Tokens / Swatches (Bottom Layer: Code Style, Middle: Testing, Top: UI Component) -->
  <g transform="translate(146, 150)" filter="url(#dslGlow)">
    <!-- Back Swatch (Code Style & Linting) -->
    <rect x="40" y="40" width="180" height="180" rx="24" fill="#3B0720" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.75" transform="rotate(-12, 130, 130)"/>
    
    <!-- Middle Swatch (Testing Frameworks) -->
    <rect x="20" y="20" width="180" height="180" rx="24" fill="#50072B" stroke="url(#sunsetGrad)" stroke-width="3" opacity="0.85" transform="rotate(6, 110, 110)"/>

    <!-- Front Primary Card (Design System UI Component & Tokens) -->
    <rect x="15" y="15" width="190" height="190" rx="26" fill="#1C0613" stroke="url(#roseGrad)" stroke-width="3.5"/>

    <!-- UI Component Details inside Front Card -->
    <!-- Window Bar -->
    <circle cx="42" cy="42" r="5" fill="#F43F5E"/>
    <circle cx="58" cy="42" r="5" fill="#F59E0B"/>
    <circle cx="74" cy="42" r="5" fill="#10B981"/>

    <!-- Design Palette Color Dots -->
    <circle cx="52" cy="80" r="12" fill="#F43F5E"/>
    <circle cx="84" cy="80" r="12" fill="#EC4899"/>
    <circle cx="116" cy="80" r="12" fill="#A855F7"/>
    <circle cx="148" cy="80" r="12" fill="#38BDF8"/>

    <!-- Typography "Aa" Glyph -->
    <text x="44" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="url(#goldGrad)">Aa</text>

    <!-- Component Button Spec -->
    <rect x="105" y="120" width="80" height="28" rx="8" fill="url(#sunsetGrad)"/>
    <rect x="117" y="131" width="56" height="6" rx="3" fill="#FFFFFF"/>

    <!-- Design Token Rules Line -->
    <line x1="42" y1="172" x2="178" y2="172" stroke="#FDA4AF" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Caliper / Compass Vector Overlay (Precision Drafting) -->
  <g transform="translate(290, 80)" filter="url(#dslGlow)">
    <!-- Compass Pivot -->
    <circle cx="60" cy="50" r="14" fill="#1F0D16" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="60" cy="50" r="6" fill="#F59E0B"/>
    <!-- Compass Left Arm -->
    <line x1="52" y1="60" x2="10" y2="150" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Compass Right Arm -->
    <line x1="68" y1="60" x2="110" y2="150" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Precision Arc Adjustment -->
    <path d="M 22 125 A 50 50 0 0 0 98 125" fill="none" stroke="#FDE68A" stroke-width="2.5"/>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 46 96 L 46 46 L 96 46" fill="none" stroke="#F43F5E" stroke-width="3" opacity="0.6"/>
  <path d="M 466 96 L 466 46 L 416 46" fill="none" stroke="#F43F5E" stroke-width="3" opacity="0.6"/>
  <path d="M 46 416 L 46 466 L 96 466" fill="none" stroke="#F43F5E" stroke-width="3" opacity="0.6"/>
  <path d="M 466 416 L 466 466 L 416 466" fill="none" stroke="#F43F5E" stroke-width="3" opacity="0.6"/>
</svg>
